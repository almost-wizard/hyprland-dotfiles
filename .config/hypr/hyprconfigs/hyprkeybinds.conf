###################
### KEYBINDINGS ###
###################

# See https://wiki.hypr.land/Configuring/Keywords/
$mainMod = SUPER # Sets "Windows" key as main modifier

# Example binds, see https://wiki.hypr.land/Configuring/Binds/ for more
bind = $mainMod, Q, exec, $terminal
bind = $mainMod, C, killactive
bind = $mainMod, E, exec, $fileManager
bind = $mainMod, V, togglefloating
bind = $mainMod SHIFT, V, pin
bind = $mainMod CTRL, V, alterzorder, top
bind = $mainMod, R, exec, $menu
bind = $mainMod, G, overview:toggle
bind = $mainMod, P, pseudo
bind = $mainMod, Z, layoutmsg, togglesplit
# bind = $mainMod, F, exec, firefox
bind = $mainMod, space, exec, pkill -x rofi || pkill -x .rofi-wrapped || ~/.config/RofiScripts/Launcher/Launcher.sh
bind = , Print, exec, ~/.config/hypr/scripts/screenshot_active_monitor.sh
bind = $mainMod SHIFT, S, exec, ~/.config/hypr/scripts/screenshot_region.sh
bind = $mainMod CTRL SHIFT, S, exec, ~/.config/hypr/scripts/screenshot_region.sh --repeat
bind = $mainMod SHIFT, R, exec, ~/.config/RofiScripts/Recorder/Recorder.sh
bind = $mainMod SHIFT, T, exec, ~/.config/hypr/scripts/ocr.sh
bind = $mainMod SHIFT, E, exec, ~/.config/RofiScripts/Emoji/Emoji.sh
bind = $mainMod SHIFT, P, exec, hyprpicker -a -l
bind = $mainMod, B, exec, pkill hyprsunset || hyprsunset -t 5400
bind = $mainMod SHIFT, F, fullscreen
bind = $mainMod, T, exec, hyprlock
bind = $mainMod, Delete, exec, hyprctl kill
bind = L-ALT, F4, exec, ~/.config/RofiScripts/powermenu/powermenu.sh
bind = $mainMod SHIFT, C, exec, ~/.config/RofiScripts/Clipboard/Clipboard.sh
bind = $mainMod SHIFT, N, exec, swaync-client -C # Clear notifications
bind = $mainMod, N, exec, swaync-client -d # Enable DnD mode
bind = $mainMod CTRL, N, exec, swaync-client -t # Open notifications
bind = $mainMod CTRL, W, exec, ~/.config/hypr/scripts/toggle_tui.sh nmtui
bind = $mainMod CTRL, B, exec, ~/.config/hypr/scripts/toggle_tui.sh bluetui
bind = $mainmod CTRL SUPER, space, exec, ~/.config/RofiScripts/WallpaperChanger/wall.sh

# Move focus with mainMod + arrow keys
bind = $mainMod, H, movefocus, l
bind = $mainMod, L, movefocus, r
bind = $mainMod, K, movefocus, u
bind = $mainMod, J, movefocus, d

# resize windows
bind = $mainMod CTRL, l, resizeactive, 100 0
bind = $mainMod CTRL, h, resizeactive, -100 0
bind = $mainMod CTRL, k, resizeactive, 0 -100
bind = $mainMod CTRL, j, resizeactive, 0 100

# Switch workspaces with mainMod + [0-9]
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10
bind = $mainMod CTRL, 1, workspace, 11
bind = $mainMod CTRL, 2, workspace, 12
bind = $mainMod CTRL, 3, workspace, 13
bind = $mainMod CTRL, 4, workspace, 14
bind = $mainMod CTRL, 5, workspace, 15
bind = $mainMod CTRL, 6, workspace, 16
bind = $mainMod CTRL, 7, workspace, 17
bind = $mainMod CTRL, 8, workspace, 18
bind = $mainMod CTRL, 9, workspace, 19
bind = $mainMod CTRL, 0, workspace, 20
bind = $mainMod, D, workspace, +1
bind = $mainMod, A, workspace, -1
bind = $mainMod, I, workspace, name:Windows

# Move active window to a workspace with mainMod + SHIFT + [0-9]
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9
bind = $mainMod SHIFT, 0, movetoworkspace, 10

# Move active window to a workspace with mainMod + CTRL + SHIFT + [0-9]
bind = $mainMod CTRL SHIFT, 1, movetoworkspace, 11
bind = $mainMod CTRL SHIFT, 2, movetoworkspace, 12
bind = $mainMod CTRL SHIFT, 3, movetoworkspace, 13
bind = $mainMod CTRL SHIFT, 4, movetoworkspace, 14
bind = $mainMod CTRL SHIFT, 5, movetoworkspace, 15
bind = $mainMod CTRL SHIFT, 6, movetoworkspace, 16
bind = $mainMod CTRL SHIFT, 7, movetoworkspace, 17
bind = $mainMod CTRL SHIFT, 8, movetoworkspace, 18
bind = $mainMod CTRL SHIFT, 9, movetoworkspace, 19
bind = $mainMod CTRL SHIFT, 0, movetoworkspace, 20

# Move active window to a side workspaces
bind = $mainMod SHIFT, L, movewindow, r
bind = $mainMod SHIFT, H, movewindow, l
bind = $mainMod SHIFT, K, movewindow, u
bind = $mainMod SHIFT, J, movewindow, d
bind = $mainMod CTRL SHIFT, L, movetoworkspace, +1
bind = $mainMod CTRL SHIFT, H, movetoworkspace, -1

# Move active window to a special "Windows" workspaces
bind = $mainMod SHIFT, I, movetoworkspace, name:Windows

# Example special workspace (scratchpad)
bind = $mainMod, W, togglespecialworkspace, magic
bind = $mainMod SHIFT, W, movetoworkspace, special:magic

# Scroll through existing workspaces with mainMod + scroll
bind = $mainMod, mouse_down, workspace, e+1
bind = $mainMod, mouse_up, workspace, e-1

# Move/resize windows with mainMod + LMB/RMB and dragging
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

# Laptop multimedia keys for volume and LCD brightness
bindel = ,XF86AudioRaiseVolume, exec, ~/.config/hypr/scripts/volume_control.sh up
bindel = ,XF86AudioLowerVolume, exec, ~/.config/hypr/scripts/volume_control.sh down
bindel = ,XF86AudioMute, exec, ~/.config/hypr/scripts/volume_control.sh mute
bindel = ,XF86AudioMicMute, exec, ~/.config/hypr/scripts/volume_control.sh mic-mute
bindel = ,XF86MonBrightnessUp, exec, ~/.config/hypr/scripts/brightness_control.sh up
bindel = ,XF86MonBrightnessDown, exec, ~/.config/hypr/scripts/brightness_control.sh down

# Requires playerctl
bind = $mainMod, bracketleft, exec, playerctl previous
bind = $mainMod, bracketright, exec, playerctl next
bind = $mainMod, backslash, exec, playerctl play-pause
bind = $mainMod SHIFT, bracketleft, exec, playerctl position 10-
bind = $mainMod SHIFT, bracketright, exec, playerctl position 10+

# Gestures
gesture = 3, horizontal, workspace
gesture = 4, up, dispatcher, overview:toggle
gesture = 4, down, dispatcher, overview:toggle
