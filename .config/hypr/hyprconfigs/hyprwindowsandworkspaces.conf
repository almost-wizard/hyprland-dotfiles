##############################
### WINDOWS AND WORKSPACES ###
##############################

# See https://wiki.hypr.land/Configuring/Window-Rules/ for more
# See https://wiki.hypr.land/Configuring/Workspace-Rules/ for workspace rules

# Example windowrule
# windowrule = float 1, match:class ^(kitty)$, match:title ^(kitty)$

workspace = 1 , monitor:eDP-1 , default:true , persistent:true
workspace = 2 , monitor:eDP-1
workspace = 3 , monitor:eDP-1 
workspace = 4 , monitor:eDP-1 
workspace = 5 , monitor:eDP-1 
workspace = 6 , monitor:eDP-1 
workspace = 7 , monitor:eDP-1 
workspace = 8 , monitor:eDP-1 
workspace = 9 , monitor:eDP-1 
workspace = 10 , monitor:eDP-1 
workspace = 11 , monitor:HDMI-A-1 , persistent:true
workspace = 12 , monitor:HDMI-A-1
workspace = 13 , monitor:HDMI-A-1
workspace = 14 , monitor:HDMI-A-1
workspace = 15 , monitor:HDMI-A-1
workspace = 16 , monitor:HDMI-A-1
workspace = 17 , monitor:HDMI-A-1
workspace = 18 , monitor:HDMI-A-1
workspace = 19 , monitor:HDMI-A-1
workspace = 20 , monitor:HDMI-A-1
workspace = name:Windows, monitor:eDP-1

# Ignore maximize requests from apps. You'll probably like this. 
windowrule = suppress_event maximize, match:class .*

# JetBrains IDE (often XWayland) can cause border flicker with `input:follow_mouse = 1`
# because tooltip windows may temporarily receive focus. Fighting focus via `no_focus 1` breaks dialogs.
# Keep JetBrains tooltip windows from stealing focus.
# In your case the tooltip has an auto-title like `winl496` (XWayland), which causes focus thrash and makes
# the tooltip disappear immediately. Match those auto-titles instead of blanket `floating:1` rules.
windowrule = no_focus 1, match:class ^(jetbrains-(studio|idea))$, match:xwayland 1, match:title ^(win[a-z]*[0-9]+)$
windowrule = float 1, size 1000 700, match:class org.kde.kdeconnect.app
windowrule = float 1, size 1000 700, match:class org.kde.kdeconnect.sms
windowrule = float 1, size 1000 700, match:class org.kde.kdeconnect-indicator
windowrule = float 1, size 879 879, match:class org.pulseaudio.pavucontrol
windowrule = float 1, size 879 879, match:class blueman-manager
windowrule = float 1, center 1, match:class xdg-desktop-portal-gtk # Portal GTK dialogs (Open/Save) open as centered floating popups
windowrule = opacity 0.80 0.75, match:class org.gnome.Nautilus
windowrule = opacity 0.95 0.85, match:class code
windowrule = opacity 0.95 0.85, match:class org.telegram.desktop
windowrule = opacity 0.80 0.85, match:initial_title yandex-music
windowrule = opacity 0.95 0.90, match:class obsidian
windowrule = workspace name:Windows silent, match:class ^(Microsoft Windows)$
windowrule = workspace name:Windows, match:class ^(xfreerdp)$
windowrule = workspace 10, match:class ^(exe)$, match:initial_title ^(DEFAULT PROJECT)$
windowrule = idle_inhibit fullscreen, match:class .*
# windowrule = workspace special:magic silent, float 1, size 682 882, move 82 151, match:class org.telegram.desktop
windowrule = workspace special:magic silent, float 1, opacity 0.85 0.75, match:class Throne
windowrule = workspace 11, match:class ^(ktalk)$

# Dragon-drop (pinned and floating)
windowrule = float 1, pin 1, match:class ^(dragon)$
windowrule = float 1, pin 1, match:title ^(dragon)$

# RDP Office apps
windowrule = workspace name:Windows, match:class ^(msword-rdp)$
windowrule = workspace name:Windows, match:class ^(msexcel-rdp)$
windowrule = workspace name:Windows, match:class ^(mspowerpoint-rdp)$
